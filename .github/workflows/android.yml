name: Android checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: python3 -B -m unittest discover -s tools -p 'test_tecalliance_vis.py'
      - name: Build Android APK
        env:
          CATALOG_API_URL: ${{ vars.CATALOG_API_URL }}
        run: flutter build apk --release --no-pub --dart-define="CATALOG_API_URL=$CATALOG_API_URL"
      - name: Build Android App Bundle for verification
        env:
          CATALOG_API_URL: ${{ vars.CATALOG_API_URL }}
        run: flutter build appbundle --release --no-pub --dart-define="CATALOG_API_URL=$CATALOG_API_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: car-care-assistant-android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
